<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート統合管理ポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- ヘッダー -->
    <div class="bg-gradient-to-r from-slate-800 to-indigo-900 rounded-2xl p-6 text-white shadow-xl flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">📋 アンケート統合管理システム</h1>
        <p class="text-xs text-slate-300 mt-1">アンケート生成・手動獲得者/対象者設定 & スプレッドシート同期</p>
      </div>
      <button id="loadSurveysBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2.5 rounded-xl font-bold transition shadow">
        シート再読み込み 🔄
      </button>
    </div>

    <!-- 1. アンケート一括生成エリア -->
    <div class="bg-white rounded-2xl shadow-xl p-6 space-y-4">
      <div class="border-b pb-3">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-full font-bold">STEP 1</span>
          新規アンケート一括生成
        </h2>
      </div>
      
      <form id="surveyForm" class="space-y-4">
        <textarea id="inputText" rows="5" required placeholder="AIが作成したテキストを貼り付け..." class="w-full border border-slate-300 rounded-xl p-4 text-sm font-mono bg-slate-50"></textarea>
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow">
          Googleフォーム生成 ＆ シートへ登録
        </button>
      </form>
      <div id="statusMessage" class="hidden text-center p-3 rounded-xl text-sm font-bold"></div>
    </div>

    <!-- 2. モニター対象者・獲得者設定エリア -->
    <div class="bg-white rounded-2xl shadow-xl p-6 space-y-6">
      <div class="border-b pb-3">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-bold">STEP 2</span>
          獲得者 ＆ 対象者データの直接反映
        </h2>
        <p class="text-xs text-slate-500 mt-1">アンケート名を選択し、獲得者・対象者の番号を入力してスプレッドシートへ書き込みます。</p>
      </div>

      <!-- アンケート名選択 -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">① 対象アンケートの選択</label>
        <select id="surveySelect" class="w-full border border-slate-300 rounded-xl p-3 text-sm bg-slate-50 font-medium">
          <option value="">-- スプレッドシートから読み込んでください --</option>
        </select>
      </div>

      <!-- 番号入力グリッド -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- 🏆 獲得者入力 -->
        <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="flex justify-between items-center">
            <label class="block text-sm font-bold text-amber-800">🏆 獲得者モニター番号</label>
            <span class="text-xs text-slate-500">区切り不要・3桁自動切出</span>
          </div>
          <textarea id="rawWinnerInput" rows="4" placeholder="例: 101102103（101, 102, 103に自動変換）" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-mono bg-white"></textarea>
          
          <div class="text-xs space-y-1">
            <div class="text-slate-600 font-medium">整形結果 (<span id="winnerCount" class="font-bold text-amber-700">0</span>人):</div>
            <div id="winnerParsed" class="p-2.5 bg-white rounded-lg border border-slate-200 font-mono text-slate-800 min-h-[40px] break-all">（なし）</div>
          </div>
        </div>

        <!-- 🎯 本アンケート対象者入力 -->
        <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="flex justify-between items-center">
            <label class="block text-sm font-bold text-emerald-800">🎯 本アンケート対象者モニター番号</label>
            <span class="text-xs text-slate-500">区切り不要・3桁自動切出</span>
          </div>
          <textarea id="rawTargetInput" rows="4" placeholder="例: 104105106（104, 105, 106に自動変換）" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-mono bg-white"></textarea>
          
          <div class="text-xs space-y-1">
            <div class="text-slate-600 font-medium">整形結果 (<span id="targetCount" class="font-bold text-emerald-700">0</span>人):</div>
            <div id="targetParsed" class="p-2.5 bg-white rounded-lg border border-slate-200 font-mono text-slate-800 min-h-[40px] break-all">（なし）</div>
          </div>
        </div>

      </div>

      <!-- 反映ボタン -->
      <button id="saveToSheetBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-base">
        💾 スプレッドシートに獲得者・対象者を反映する
      </button>

      <div id="syncStatus" class="hidden text-center p-3 rounded-xl text-sm font-bold"></div>

    </div>

  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyhZoykw8fxGd1a_unzChuHFct1dK-P9S8TErPVTmZZrYUyXx48c2KvQWFj5djAXUsU/exec";

    function parse3DigitCodes(inputStr) {
      const rawDigits = inputStr.replace(/\D/g, '');
      const matches = rawDigits.match(/.{1,3}/g) || [];
      return matches.filter(code => code.length === 3);
    }

    const winnerInput = document.getElementById('rawWinnerInput');
    const winnerParsed = document.getElementById('winnerParsed');
    const winnerCount = document.getElementById('winnerCount');

    winnerInput.addEventListener('input', () => {
      const codes = parse3DigitCodes(winnerInput.value);
      winnerParsed.textContent = codes.length > 0 ? codes.join(', ') : '（なし）';
      winnerCount.textContent = codes.length;
    });

    const targetInput = document.getElementById('rawTargetInput');
    const targetParsed = document.getElementById('targetParsed');
    const targetCount = document.getElementById('targetCount');

    targetInput.addEventListener('input', () => {
      const codes = parse3DigitCodes(targetInput.value);
      targetParsed.textContent = codes.length > 0 ? codes.join(', ') : '（なし）';
      targetCount.textContent = codes.length;
    });

    async function loadSurveys() {
      const select = document.getElementById('surveySelect');
      select.innerHTML = '<option value="">読み込み中...</option>';
      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();
        if (data.status === "OK") {
          select.innerHTML = '<option value="">-- アンケートを選択してください --</option>';
          data.surveys.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.title;
            opt.textContent = `[${s.type}] ${s.title} (${s.point}pt)`;
            opt.dataset.winner = s.winner || "";
            opt.dataset.target = s.target || "";
            select.appendChild(opt);
          });
        }
      } catch (e) {
        select.innerHTML = '<option value="">読み込み失敗</option>';
      }
    }

    document.getElementById('surveySelect').addEventListener('change', (e) => {
      const selected = e.target.options[e.target.selectedIndex];
      if (selected && selected.value) {
        winnerInput.value = selected.dataset.winner || "";
        targetInput.value = selected.dataset.target || "";
        winnerInput.dispatchEvent(new Event('input'));
        targetInput.dispatchEvent(new Event('input'));
      }
    });

    document.getElementById('loadSurveysBtn').addEventListener('click', loadSurveys);

    document.getElementById('saveToSheetBtn').addEventListener('click', async () => {
      const title = document.getElementById('surveySelect').value;
      const syncStatus = document.getElementById('syncStatus');
      
      if (!title) {
        alert('アンケートを選択してください。');
        return;
      }

      const winners = parse3DigitCodes(winnerInput.value).join(', ');
      const targets = parse3DigitCodes(targetInput.value).join(', ');

      syncStatus.className = "p-3 rounded-xl text-sm font-bold bg-amber-100 text-amber-800 border border-amber-300 text-center";
      syncStatus.textContent = "スプレッドシートへ更新中...";
      syncStatus.classList.remove('hidden');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: "updateSurveys",
            title: title,
            winner: winners,
            target: targets
          })
        });
        const result = await res.json();

        if (result.status === "OK") {
          syncStatus.className = "p-3 rounded-xl text-sm font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 text-center";
          syncStatus.textContent = `✅ スプレッドシートを更新しました！（${title}）`;
          loadSurveys();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        syncStatus.className = "p-3 rounded-xl text-sm font-bold bg-rose-100 text-rose-800 border border-rose-300 text-center";
        syncStatus.textContent = "❌ 更新失敗: " + err.message;
      }
    });

    loadSurveys();
  </script>
</body>
</html>
