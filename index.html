<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート統合管理ポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- ヘッダー -->
    <div class="bg-gradient-to-r from-slate-800 to-indigo-900 rounded-2xl p-6 text-white shadow-xl flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">📋 アンケート統合管理システム</h1>
        <p class="text-xs text-slate-300 mt-1">グループ管理・一括生成・複数選択一括更新</p>
      </div>
      <button id="loadSurveysBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2.5 rounded-xl font-bold transition shadow">
        シート再読み込み 🔄
      </button>
    </div>

    <!-- 1. 新規アンケート一括生成エリア（グループ名付き） -->
    <div class="bg-white rounded-2xl shadow-xl p-6 space-y-4">
      <div class="border-b pb-3">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-full font-bold">STEP 1</span>
          新規アンケート一括生成（グループ設定）
        </h2>
      </div>
      
      <form id="surveyForm" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">グループ名（タグ）</label>
          <input type="text" id="groupNameInput" required placeholder="例: 4月度案件A" class="w-full border border-slate-300 rounded-xl p-3 text-sm bg-slate-50">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">AIテキスト貼り付け</label>
          <textarea id="inputText" rows="5" required placeholder="=== アンケート 1 ===&#10;タイトル: ...&#10;..." class="w-full border border-slate-300 rounded-xl p-4 text-sm font-mono bg-slate-50"></textarea>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow">
          Googleフォーム一括生成 ＆ 登録
        </button>
      </form>
      <div id="statusMessage" class="hidden text-center p-3 rounded-xl text-sm font-bold"></div>
    </div>

    <!-- 2. グループ別・複数選択一括設定エリア -->
    <div class="bg-white rounded-2xl shadow-xl p-6 space-y-6">
      <div class="border-b pb-3">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-bold">STEP 2</span>
          獲得者 ＆ 対象者の一括設定
        </h2>
      </div>

      <!-- フィルター ＆ 全選択 -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
        <div class="w-full md:w-1/2">
          <label class="block text-xs font-bold text-slate-600 mb-1">グループで絞り込み</label>
          <select id="groupFilterSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white font-medium">
            <option value="ALL">すべて表示</option>
          </select>
        </div>
        <div class="flex gap-2 w-full md:w-auto justify-end">
          <button id="selectAllBtn" type="button" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg font-bold transition">表示中を全選択</button>
          <button id="deselectAllBtn" type="button" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg font-bold transition">全解除</button>
        </div>
      </div>

      <!-- チェックボックス一覧 -->
      <div id="surveyCheckboxContainer" class="max-h-60 overflow-y-auto border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
        <p class="text-xs text-slate-400">読み込み中...</p>
      </div>

      <!-- 番号入力グリッド -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="flex justify-between items-center">
            <label class="block text-sm font-bold text-amber-800">🏆 獲得者モニター番号</label>
            <span class="text-xs text-slate-500">3桁自動分割</span>
          </div>
          <textarea id="rawWinnerInput" rows="4" placeholder="例: 101102103" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-mono bg-white"></textarea>
          <div class="text-xs space-y-1">
            <div class="text-slate-600 font-medium">整形結果 (<span id="winnerCount" class="font-bold text-amber-700">0</span>人):</div>
            <div id="winnerParsed" class="p-2.5 bg-white rounded-lg border border-slate-200 font-mono text-slate-800 min-h-[40px] break-all">（なし）</div>
          </div>
        </div>

        <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="flex justify-between items-center">
            <label class="block text-sm font-bold text-emerald-800">🎯 本アンケート対象者モニター番号</label>
            <span class="text-xs text-slate-500">3桁自動分割</span>
          </div>
          <textarea id="rawTargetInput" rows="4" placeholder="例: 104105106" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-mono bg-white"></textarea>
          <div class="text-xs space-y-1">
            <div class="text-slate-600 font-medium">整形結果 (<span id="targetCount" class="font-bold text-emerald-700">0</span>人):</div>
            <div id="targetParsed" class="p-2.5 bg-white rounded-lg border border-slate-200 font-mono text-slate-800 min-h-[40px] break-all">（なし）</div>
          </div>
        </div>
      </div>

      <!-- 反映ボタン -->
      <button id="saveToSheetBtn" type="button" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-base">
        💾 選択したすべてのアンケートに一括反映する
      </button>

      <div id="syncStatus" class="hidden text-center p-3 rounded-xl text-sm font-bold"></div>
    </div>

  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyhZoykw8fxGd1a_unzChuHFct1dK-P9S8TErPVTmZZrYUyXx48c2KvQWFj5djAXUsU/exec";
    let allSurveysData = [];

    function parse3DigitCodes(inputStr) {
      const rawDigits = inputStr.replace(/\D/g, '');
      const matches = rawDigits.match(/.{1,3}/g) || [];
      return matches.filter(code => code.length === 3);
    }

    const winnerInput = document.getElementById('rawWinnerInput');
    const winnerParsed = document.getElementById('winnerParsed');
    const winnerCount = document.getElementById('winnerCount');
    winnerInput.addEventListener('input', () => {
      const codes = parse3DigitCodes(winnerInput.value);
      winnerParsed.textContent = codes.length > 0 ? codes.join(', ') : '（なし）';
      winnerCount.textContent = codes.length;
    });

    const targetInput = document.getElementById('rawTargetInput');
    const targetParsed = document.getElementById('targetParsed');
    const targetCount = document.getElementById('targetCount');
    targetInput.addEventListener('input', () => {
      const codes = parse3DigitCodes(targetInput.value);
      targetParsed.textContent = codes.length > 0 ? codes.join(', ') : '（なし）';
      targetCount.textContent = codes.length;
    });

    // 新規作成送信
    document.getElementById('surveyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMessage');

      btn.disabled = true;
      btn.innerHTML = "一括生成中...";
      status.className = "hidden";

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            textData: document.getElementById('inputText').value,
            groupName: document.getElementById('groupNameInput').value
          })
        });
        const result = await res.json();
        if (result.status === "OK") {
          status.className = "text-center p-3 rounded-xl text-sm font-bold bg-emerald-100 text-emerald-800 border border-emerald-300";
          status.textContent = `🎉 成功: ${result.count}件のアンケートを作成しグループ登録しました！`;
          document.getElementById('inputText').value = "";
          loadSurveys();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        status.className = "text-center p-3 rounded-xl text-sm font-bold bg-rose-100 text-rose-800 border border-rose-300";
        status.textContent = "❌ エラー: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Googleフォーム一括生成 ＆ 登録";
        status.classList.remove('hidden');
      }
    });

    // 一覧読み込み
    async function loadSurveys() {
      const container = document.getElementById('surveyCheckboxContainer');
      const groupSelect = document.getElementById('groupFilterSelect');
      container.innerHTML = '<p class="text-xs text-slate-400">読み込み中...</p>';
      
      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();
        if (data.status === "OK") {
          allSurveysData = data.surveys;
          const groups = [...new Set(allSurveysData.map(s => s.groupName))];
          const currentGroupVal = groupSelect.value;
          
          groupSelect.innerHTML = '<option value="ALL">すべて表示</option>';
          groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            opt.textContent = g;
            groupSelect.appendChild(opt);
          });
          if (groups.includes(currentGroupVal)) groupSelect.value = currentGroupVal;

          renderCheckboxes();
        }
      } catch (e) {
        container.innerHTML = '<p class="text-xs text-rose-500 font-bold">読み込み失敗</p>';
      }
    }

    function renderCheckboxes() {
      const container = document.getElementById('surveyCheckboxContainer');
      const selectedGroup = document.getElementById('groupFilterSelect').value;
      const filtered = allSurveysData.filter(s => selectedGroup === 'ALL' || s.groupName === selectedGroup);

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">該当するアンケートがありません。</p>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach(s => {
        const wrapper = document.createElement('label');
        wrapper.className = "flex items-center justify-between bg-white p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-50 transition";
        wrapper.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" value="${s.title}" class="survey-checkbox w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 border-slate-300">
            <div>
              <span class="text-sm font-bold text-slate-800">${s.title}</span>
              <span class="text-xs text-slate-500 ml-2">(${s.point}pt / ${s.type})</span>
            </div>
          </div>
          <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded font-semibold border border-indigo-100">${s.groupName}</span>
        `;
        container.appendChild(wrapper);
      });
    }

    document.getElementById('groupFilterSelect').addEventListener('change', renderCheckboxes);

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      document.querySelectorAll('.survey-checkbox').forEach(cb => cb.checked = true);
    });
    document.getElementById('deselectAllBtn').addEventListener('click', () => {
      document.querySelectorAll('.survey-checkbox').forEach(cb => cb.checked = false);
    });

    document.getElementById('loadSurveysBtn').addEventListener('click', loadSurveys);

    // 一括反映
    document.getElementById('saveToSheetBtn').addEventListener('click', async () => {
      const selectedBoxes = Array.from(document.querySelectorAll('.survey-checkbox:checked'));
      const syncStatus = document.getElementById('syncStatus');
      
      if (selectedBoxes.length === 0) {
        alert('対象のアンケートを1つ以上選択してください。');
        return;
      }

      const titles = selectedBoxes.map(cb => cb.value);
      const winners = parse3DigitCodes(winnerInput.value).join(', ');
      const targets = parse3DigitCodes(targetInput.value).join(', ');

      syncStatus.className = "p-3 rounded-xl text-sm font-bold bg-amber-100 text-amber-800 border border-amber-300 text-center";
      syncStatus.textContent = `${titles.length}件のアンケートへ一括反映中...`;
      syncStatus.classList.remove('hidden');

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: "updateSurveys",
            titles: titles,
            winner: winners,
            target: targets
          })
        });
        const result = await res.json();
        if (result.status === "OK") {
          syncStatus.className = "p-3 rounded-xl text-sm font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 text-center";
          syncStatus.textContent = `✅ 一括反映完了: 選択した${titles.length}件のアンケートを更新しました！`;
          loadSurveys();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        syncStatus.className = "p-3 rounded-xl text-sm font-bold bg-rose-100 text-rose-800 border border-rose-300 text-center";
        syncStatus.textContent = "❌ 更新エラー: " + err.message;
      }
    });

    loadSurveys();
  </script>
</body>
</html>
