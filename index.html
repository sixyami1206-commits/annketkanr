<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
    h2 { margin-top: 0; font-size: 1.3em; color: #1a252f; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    h3 { font-size: 1.1em; color: #2c3e50; margin-top: 20px; }
    
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { background: #27ae60; color: #ffffff; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #219150; }
    
    /* アンケートカード */
    .survey-item { border: 1px solid #e1e8ed; border-left: 5px solid #3498db; padding: 14px; margin-bottom: 12px; background: #ffffff; border-radius: 6px; }
    
    /* 「本」アンケートを目立たせる強調枠 */
    .survey-item.main-survey { border-left-color: #e67e22; background: #fffdf9; border-color: #f39c12; }
    
    /* 【即P】タグ：上品で目立つバッジ */
    .badge-instant {
      display: inline-flex;
      align-items: center;
      background: #eb4d4b;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      margin-right: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 1px 3px rgba(235, 77, 75, 0.3);
    }
    
    .type-badge {
      display: inline-block;
      background: #7f8c8d;
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 6px;
    }
    .type-badge.main { background: #e67e22; }

    .survey-meta { font-size: 12px; color: #7f8c8d; margin-top: 6px; line-height: 1.5; }
    .points-info { font-weight: bold; color: #2c3e50; margin-top: 8px; font-size: 1.05em; }
    .yen-info { color: #d35400; font-weight: bold; margin-left: 6px; }
    .btn-answer { display: inline-block; background: #2980b9; color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: bold; margin-top: 8px; text-align: center; }
    .hidden { display: none; }
    .link-btn { color: #2980b9; text-decoration: none; font-size: 13px; display: inline-block; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-section" class="card">
    <h2>クロワルモニター ログイン</h2>
    <p style="font-size: 12px; color: #e74c3c;">※サイトリニューアルのため、再ログインが必要です。</p>
    <input type="text" id="login-id" placeholder="モニター番号">
    <input type="text" id="login-name" placeholder="登録名">
    <input type="text" id="login-pref" placeholder="県（例: 東京都）">
    <button onclick="handleLogin()">ログイン</button>
    <a href="#" class="link-btn" onclick="showRegister()">新規モニター登録はこちら</a>
  </div>

  <!-- 新規登録画面 -->
  <div id="register-section" class="card hidden">
    <h2>新規モニター登録</h2>
    <input type="text" id="reg-id" placeholder="モニター番号">
    <input type="text" id="reg-name" placeholder="名前">
    <input type="text" id="reg-pref" placeholder="県">
    <select id="reg-age">
      <option value="">年齢層を選択してください</option>
      <option value="10-20">10-20</option>
      <option value="30-50">30-50</option>
      <option value="50-55">50-55</option>
      <option value="60-70">60-70</option>
      <option value="その他">その他</option>
    </select>
    <button onclick="handleRegister()">登録する</button>
    <a href="#" class="link-btn" onclick="showLogin()">ログイン画面に戻る</a>
  </div>

  <!-- マイページ & アンケート一覧 -->
  <div id="app-section" class="card hidden">
    <h2>マイページ</h2>
    <div style="background:#f8f9fa; border:1px solid #e9ecef; padding:12px; border-radius:8px; margin-bottom:15px;">
      <p style="margin:4px 0;"><strong>会員名:</strong> <span id="user-name"></span> 様 (<span id="user-id"></span>)</p>
      <p style="margin:4px 0;"><strong>保有ポイント:</strong> <strong id="user-points" style="font-size:1.2em; color:#e67e22;">0</strong> pt 
         <span id="user-yen" class="yen-info">（0円分相当）</span></p>
      <p style="margin:4px 0;"><strong>アンケート回答数:</strong> <span id="user-count">0</span> 回</p>
    </div>
    <button onclick="handleLogout()" style="background:#95a5a6; padding:8px; margin-bottom:10px;">ログアウト</button>

    <h3>利用可能なアンケート一覧</h3>
    <div id="survey-list">読み込み中...</div>
  </div>

  <script>
    // サイトリニューアル対応：初回来訪時にローカルストレージのセッションを破棄して強制ログアウト
    window.onload = function() {
      const isRelaunched = localStorage.getItem('site_relaunched_v3');
      if (!isRelaunched) {
        localStorage.removeItem('kurowaru_user');
        localStorage.setItem('site_relaunched_v3', 'true');
      }
      
      const savedUser = JSON.parse(localStorage.getItem('kurowaru_user'));
      if (savedUser) {
        autoLogin(savedUser);
      }
    };

    function showRegister() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('register-section').classList.remove('hidden');
    }

    function showLogin() {
      document.getElementById('register-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }

    // 会員登録実行
    function handleRegister() {
      const data = {
        monitorId: document.getElementById('reg-id').value.trim(),
        name: document.getElementById('reg-name').value.trim(),
        prefecture: document.getElementById('reg-pref').value.trim(),
        ageGroup: document.getElementById('reg-age').value
      };

      if (!data.monitorId || !data.name || !data.prefecture || !data.ageGroup) {
        alert('すべての項目を入力してください。');
        return;
      }

      google.script.run.withSuccessHandler(res => {
        alert(res.message);
        if (res.success) showLogin();
      }).registerUser(data);
    }

    // ログイン実行
    function handleLogin() {
      const id = document.getElementById('login-id').value.trim();
      const name = document.getElementById('login-name').value.trim();
      const pref = document.getElementById('login-pref').value.trim();

      if (!id || !name || !pref) {
        alert('モニター番号、名前、県をすべて入力してください。');
        return;
      }

      google.script.run.withSuccessHandler(res => {
        if (res.success) {
          localStorage.setItem('kurowaru_user', JSON.stringify(res.user));
          renderApp(res.user);
        } else {
          alert(res.message);
        }
      }).loginUser(id, name, pref);
    }

    // 自動ログイン
    function autoLogin(user) {
      google.script.run.withSuccessHandler(res => {
        if (res.success) {
          localStorage.setItem('kurowaru_user', JSON.stringify(res.user));
          renderApp(res.user);
        }
      }).loginUser(user.monitorId, user.name, user.prefecture);
    }

    // ログアウト
    function handleLogout() {
      localStorage.removeItem('kurowaru_user');
      location.reload();
    }

    // マイページ描画
    function renderApp(user) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('register-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');

      document.getElementById('user-id').innerText = user.monitorId;
      document.getElementById('user-name').innerText = user.name;
      document.getElementById('user-points').innerText = user.points;
      
      const yen = (user.points / 10).toFixed(0);
      document.getElementById('user-yen').innerText = `（${yen}円分相当）`;
      document.getElementById('user-count').innerText = user.responseCount;

      loadSurveys();
    }

    // アンケート一覧読み込み・描画
    function loadSurveys() {
      google.script.run.withSuccessHandler(surveys => {
        const container = document.getElementById('survey-list');
        container.innerHTML = '';

        if (surveys.length === 0) {
          container.innerHTML = '<p style="color:#7f8c8d;">現在利用できるアンケートはありません。</p>';
          return;
        }

        surveys.forEach(s => {
          const div = document.createElement('div');
          const isMain = s.type === '本';
          div.className = 'survey-item' + (isMain ? ' main-survey' : '');
          
          let titleDisplay = s.title.replace('【即P】', '').trim();
          let badgeHtml = s.isInstant ? `<span class="badge-instant">即時ポイント付与</span>` : '';
          let typeBadge = `<span class="type-badge ${isMain ? 'main' : ''}">${s.type || '事前'}</span>`;

          let metaDetails = [];
          if (s.deadline) metaDetails.push(`回答期限: ${s.deadline}`);
          if (s.targetUsers) metaDetails.push(`対象: ${s.targetUsers}`);
          if (s.pointEarners) metaDetails.push(`ポイント獲得者: ${s.pointEarners}`);

          let linkHtml = s.link ? `<a href="${s.link}" target="_blank" class="btn-answer">アンケートに回答する</a>` : '';

          div.innerHTML = `
            <div style="font-size:15px; font-weight:bold; line-height:1.4;">
              ${badgeHtml}${typeBadge}${titleDisplay}
            </div>
            <div class="points-info">
              ポイント: ${s.points} <span class="yen-info">(${s.yenValue})</span>
            </div>
            ${metaDetails.length > 0 ? `<div class="survey-meta">${metaDetails.join(' | ')}</div>` : ''}
            ${linkHtml}
          `;
          container.appendChild(div);
        });
      }).getSurveys();
    }
  </script>
</body>
</html>
